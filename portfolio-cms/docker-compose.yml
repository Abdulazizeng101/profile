# Local PostgreSQL for development only.
#
#   docker compose up -d        # start (data persists in the "pgdata" volume)
#   docker compose down         # stop, keep data
#   docker compose down -v      # stop and DELETE all local data
#
# Matches the DATABASE_URL example in .env.example. These credentials are for
# your machine only; the port is bound to localhost so nothing else can reach it.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates portfolio_test and portfolio_e2e for the automated tests on first start.
      - ./scripts/docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
